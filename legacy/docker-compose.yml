# Stack that is created then stopped: every container exited, a candidate
# for archiving.
services:
  app:
    image: busybox:1.37
    command: ["sh", "-c", "sleep 3600"]
    mem_limit: 16m
  db:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    mem_limit: 32m
